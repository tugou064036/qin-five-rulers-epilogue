<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>尾声 · 我到底是谁</title>
<meta name="description" content="课程结尾互动：这一课代入的“我”，其实是秦国前后五位君主。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   基础与主题（沿用 demo：stone 黑底 + amber 金）
   ========================================================= */
:root {
  --stone-950: #0c0a09;
  --stone-900: #1c1917;
  --stone-800: #292524;
  --stone-700: #44403c;
  --stone-400: #a8a29e;
  --stone-300: #d6d3d1;
  --stone-200: #e7e5e4;
  --stone-100: #f5f5f4;
  --amber-200: #fde68a;
  --amber-300: #fcd34d;
  --amber-400: #fbbf24;
  --amber-500: #f59e0b;
  --amber-600: #d97706;
  --gold: #e3bc78;
  --gold-soft: #c9a15a;
  --seal: #b3261e;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--stone-100); }
body {
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber-400); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 16:9 舞台：所有尺寸以 cqw（舞台宽度的 1%）为单位，等比缩放 */
.viewport { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
.stage {
  position: relative;
  width: min(100vw, calc(100vh * 16 / 9));
  aspect-ratio: 16 / 9;
  overflow: hidden;
  container-type: size;
  background: var(--stone-950);
  isolation: isolate;
}

/* =========================================================
   背景层
   ========================================================= */
.bg, .bg > * { position: absolute; inset: 0; pointer-events: none; }
.bg-glow {
  background:
    radial-gradient(60% 46% at 50% 58%, rgba(146, 98, 44, .30), rgba(70, 44, 20, .12) 55%, transparent 75%),
    radial-gradient(120% 80% at 50% 110%, rgba(40, 26, 14, .9), transparent 60%),
    linear-gradient(#070605, #0e0b08 55%, #080605);
  transition: opacity 1.2s;
}
.bg-mountains { width: 100%; height: 100%; opacity: .9; }
.bg-watermark {
  display: grid; place-items: center;
  font-family: var(--serif); font-weight: 900;
  font-size: 44cqw; line-height: 1;
  color: rgba(227, 188, 120, .013);
  transform: translateY(-3cqw);
  transition: color 1.6s, text-shadow 1.6s;
}
.fog { opacity: .55; filter: blur(2cqw); }
.fog-a { background: radial-gradient(40% 18% at 30% 70%, rgba(150, 120, 90, .16), transparent 70%); animation: drift 38s ease-in-out infinite alternate; }
.fog-b { background: radial-gradient(36% 14% at 72% 62%, rgba(150, 120, 90, .13), transparent 70%); animation: drift 46s ease-in-out infinite alternate-reverse; }
@keyframes drift { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
#dust { width: 100%; height: 100%; }
.vignette { background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, .75)); }

/* =========================================================
   顶部 HUD
   ========================================================= */
.hud {
  position: absolute; top: 1.6cqw; left: 2.4cqw; right: 2.4cqw;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 30;
}
.chapter { font-family: var(--mono); font-size: .78cqw; letter-spacing: .32em; color: var(--amber-500); text-transform: uppercase; }
.chapter b { font-family: var(--serif); font-weight: 600; letter-spacing: .3em; color: var(--stone-300); margin-left: .6cqw; }
.hud-right { display: flex; align-items: center; gap: 1cqw; }
.progress { display: flex; align-items: center; gap: .55cqw; font-family: var(--mono); font-size: .78cqw; letter-spacing: .12em; color: var(--stone-400); transition: opacity .6s; }
.progress i { width: .62cqw; height: .62cqw; transform: rotate(45deg); border: 1px solid rgba(227, 188, 120, .55); transition: background .4s, box-shadow .4s; }
.progress i.on { background: var(--gold); box-shadow: 0 0 .6cqw rgba(227, 188, 120, .8); }
.progress b { color: var(--amber-300); font-weight: 500; }
.icon-btn {
  display: inline-flex; align-items: center; gap: .4cqw;
  height: 2.1cqw; padding: 0 .8cqw; border-radius: .5cqw;
  border: 1px solid rgba(217, 119, 6, .45); color: var(--amber-200);
  font-size: .78cqw; letter-spacing: .1em;
  background: rgba(12, 10, 9, .6);
  transition: border-color .3s, background .3s, opacity .3s;
}
.icon-btn:hover { border-color: var(--amber-500); background: rgba(41, 37, 36, .8); }
.icon-btn svg { width: 1cqw; height: 1cqw; }
.icon-btn[aria-pressed="false"] { color: var(--stone-400); border-color: var(--stone-700); }
.icon-btn[hidden] { display: none; }
.stage[data-phase="os"] .progress, .stage[data-phase="split"] .progress { opacity: 0; }

/* =========================================================
   标题区
   ========================================================= */
.headline { position: absolute; top: 4.6cqw; left: 0; right: 0; text-align: center; z-index: 20; pointer-events: none; transition: opacity .5s; }
.headline h1 {
  margin: 0; font-weight: 900; font-size: 2.55cqw; letter-spacing: .26em; text-indent: .26em;
  color: var(--stone-100); text-shadow: 0 0 2cqw rgba(0, 0, 0, .8);
}
.headline h1 em { font-style: normal; color: var(--amber-300); }
.headline p { margin: 1cqw 0 0; font-size: 1.12cqw; letter-spacing: .2em; color: var(--stone-300); }
.headline .swap { display: block; opacity: 0; transform: translateY(.6cqw); filter: blur(.3cqw); transition: opacity .8s var(--ease), transform .8s var(--ease), filter .8s; }
.headline .swap.show { opacity: 1; transform: none; filter: none; }
.stage.has-active .headline { opacity: .35; }

/* =========================================================
   “我”的剪影（衔接上一段动画）
   ========================================================= */
.me {
  position: absolute; left: calc(50cqw - 6.125cqw); top: 15cqw; width: 12.25cqw; height: 24.5cqw;
  z-index: 6; pointer-events: none;
  transition: opacity .9s, filter .9s, transform 1.2s var(--ease);
}
.me svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 .3cqw rgba(226, 178, 104, .55)); }
.stage[data-phase="split"] .me { opacity: 0; filter: brightness(2.4) blur(.4cqw); transform: scale(1.06); }
.stage:not([data-phase="os"]):not([data-phase="split"]) .me { opacity: 0; visibility: hidden; }

/* =========================================================
   五位君主
   ========================================================= */
.row { position: absolute; inset: 0; margin: 0; padding: 0; list-style: none; z-index: 10; pointer-events: none; }
.slot {
  --w: 12.25cqw;
  position: absolute; top: 15cqw; left: calc(var(--x) * 1cqw - var(--w) / 2);
  width: var(--w); height: 30cqw;
  transform: translateX(calc((50 - var(--x)) * 1cqw));
  opacity: 0;
  transition: transform 1.35s var(--ease), opacity .8s;
}
.stage[data-phase="split"] .slot { opacity: .5; }
.stage[data-phase="spread"] .slot,
.stage[data-phase="explore"] .slot,
.stage[data-phase="finale"] .slot { transform: none; opacity: 1; }
.stage[data-phase="explore"] .slot, .stage[data-phase="finale"] .slot { pointer-events: auto; }
.slot.is-active { z-index: 3; }

.monarch { position: absolute; inset: 0; display: block; width: 100%; border-radius: 1cqw; }
.monarch:focus-visible { outline-offset: .3cqw; }
.fig {
  position: absolute; left: 0; top: 0; width: 100%; height: 24.5cqw;
  transform-origin: 50% 100%;
  transition: transform .6s var(--ease), opacity .5s, filter .5s;
}
.fig svg, .fig img { width: 100%; height: 100%; display: block; overflow: visible; object-fit: contain; object-position: 50% 100%; }
.fig svg, .fig img {
  filter: drop-shadow(0 0 .22cqw rgba(226, 178, 104, .42));
  transition: filter .6s;
}
.fig::after { /* 脚下阴影 */
  content: ""; position: absolute; left: 12%; right: 12%; bottom: -.7cqw; height: 1.4cqw;
  background: radial-gradient(closest-side, rgba(0, 0, 0, .85), transparent);
  z-index: -1;
}
/* 悬停态：放大 + 点亮；其余变暗 */
.slot.is-active .fig { transform: scale(1.16) translateY(-.2cqw); }
.stage.has-active .slot:not(.is-active) .fig { transform: scale(.94); opacity: .62; filter: brightness(.62) saturate(.7); }
.slot.is-lit .fig svg, .slot.is-lit .fig img {
  filter: drop-shadow(0 0 .3cqw rgba(250, 214, 150, .9)) drop-shadow(0 0 1.6cqw rgba(232, 170, 80, .38));
}
.stage[data-phase="split"] .slot .fig { filter: brightness(1.7) blur(.12cqw); }

/* SVG 内部分层：剪影 → 暖光 → 肤色 → 五官 → 金线 */
.fig-svg .sil-base { fill: url(#g-base); }
.fig-svg .sil-warm { fill: url(#g-warm); opacity: 0; transition: opacity .7s; }
.fig-svg .skin { fill: url(#g-skin); opacity: 0; transition: opacity .7s; }
.fig-svg .dark { fill: #0a0806; }
.fig-svg .feat .eye { fill: #1b110a; stroke: none; }
.fig-svg .feat { fill: none; stroke: #2b1a0f; stroke-width: 1.5; stroke-linecap: round; opacity: 0; transition: opacity .7s; }
.fig-svg .lines { fill: none; stroke: url(#g-gold); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .2; transition: opacity .7s; }
.fig-svg .lines .fill { fill: url(#g-gold); stroke: none; }
.fig-svg .lines .pat { fill: url(#g-meander); stroke: none; }
.fig-svg .lines .lam { fill: url(#g-lamellar); stroke: none; }
.fig-svg .under { fill: #d8ccb2; opacity: 0; transition: opacity .7s; }
.fig-svg .tint-red { fill: #120807; transition: fill .7s; }
.fig-svg .tint-jade { fill: #0e0c09; transition: fill .7s; }
.fig-svg .flag { transform-box: view-box; transform-origin: 262px 44px; animation: flag 4.6s ease-in-out infinite; }
@keyframes flag { 0%, 100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-3deg) scaleX(.94); } }

.slot.is-heard .fig-svg .lines { opacity: .45; }
.slot.is-heard .fig-svg .sil-warm { opacity: .22; }
.slot.is-lit .fig-svg .sil-warm { opacity: .9; }
.slot.is-lit .fig-svg .skin { opacity: .92; }
.slot.is-lit .fig-svg .feat { opacity: .85; }
.slot.is-lit .fig-svg .lines { opacity: 1; }
.slot.is-lit .fig-svg .under { opacity: .7; }
.slot.is-lit .fig-svg .tint-red { fill: url(#g-red); }
.slot.is-lit .fig-svg .tint-jade { fill: url(#g-jade); }

/* 名牌（站在时间线上） */
.plate {
  position: absolute; left: 50%; top: 25.3cqw; transform: translateX(-50%);
  display: grid; justify-items: center; gap: .25cqw; white-space: nowrap;
  transition: transform .5s var(--ease), opacity .5s;
}
.plate .name { display: flex; align-items: center; gap: .45cqw; font-weight: 700; font-size: 1.34cqw; letter-spacing: .16em; color: var(--stone-200); transition: color .4s; }
.plate .ord {
  display: inline-grid; place-items: center; width: 1.25cqw; height: 1.25cqw;
  font-size: .72cqw; font-style: normal; font-weight: 700; letter-spacing: 0;
  border: 1px solid rgba(168, 162, 158, .6); color: var(--stone-400); border-radius: .14cqw;
  transition: background .4s, color .4s, border-color .4s, transform .4s;
}
.plate .era { font-family: var(--mono); font-size: .7cqw; letter-spacing: .06em; color: var(--stone-400); }
.slot.is-heard .plate .ord { background: var(--seal); border-color: var(--seal); color: #fbeee0; }
.slot.is-active .plate .name { color: var(--amber-200); }
.slot.is-active .plate { transform: translateX(-50%) translateY(.25cqw); }
.stage.has-active .slot:not(.is-active) .plate { opacity: .5; }

/* 揭晓：功绩印章 */
.seal {
  position: absolute; left: 50%; top: -2.5cqw; width: 2.7cqw; height: 2.7cqw;
  display: grid; grid-template: 1fr 1fr / 1fr 1fr; place-items: center;
  padding: .22cqw; font-size: 1cqw; font-weight: 900; line-height: 1;
  color: #fbeee0; background: var(--seal); border-radius: .16cqw;
  box-shadow: inset 0 0 0 .1cqw rgba(251, 238, 224, .7), 0 .4cqw 1cqw rgba(0, 0, 0, .55);
  filter: url(#f-rough);
  opacity: 0; pointer-events: none;
  transform: translate(-50%, 0) rotate(-3deg) scale(2.2);
}
.seal b { font-weight: 900; }
.stage[data-phase="finale"] .seal { animation: stamp .55s var(--ease) forwards; animation-delay: calc(.5s + var(--i) * .32s); }
@keyframes stamp {
  0% { opacity: 0; transform: translate(-50%, -1cqw) rotate(-3deg) scale(2.2); }
  60% { opacity: 1; transform: translate(-50%, 0) rotate(-3deg) scale(.92); }
  100% { opacity: 1; transform: translate(-50%, 0) rotate(-3deg) scale(1); }
}

/* 时间线 */
.timeline { position: absolute; left: 7cqw; right: 7cqw; top: 39.5cqw; height: 0; z-index: 8; pointer-events: none; }
.timeline::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(227, 188, 120, .7) 8%, rgba(227, 188, 120, .7) 92%, transparent);
  transform: scaleX(0); transform-origin: 0 50%;
  transition: transform 1.6s var(--ease);
}
.timeline::after { /* 箭头：时间向前 */
  content: ""; position: absolute; right: 2.2cqw; top: -.32cqw; width: .64cqw; height: .64cqw;
  border-top: 1px solid rgba(227, 188, 120, .7); border-right: 1px solid rgba(227, 188, 120, .7);
  transform: rotate(45deg); opacity: 0; transition: opacity .6s 1.2s;
}
.stage[data-phase="spread"] .timeline::before, .stage[data-phase="explore"] .timeline::before, .stage[data-phase="finale"] .timeline::before { transform: scaleX(1); }
.stage[data-phase="spread"] .timeline::after, .stage[data-phase="explore"] .timeline::after, .stage[data-phase="finale"] .timeline::after { opacity: 1; }
.gap {
  position: absolute; top: 39.5cqw; left: calc(var(--x) * 1cqw); transform: translate(-50%, -140%);
  font-size: .72cqw; letter-spacing: .2em; color: rgba(214, 211, 209, .62); white-space: nowrap; z-index: 8;
  opacity: 0; transition: opacity .8s; pointer-events: none;
}
.gap::before, .gap::after { content: "·"; margin: 0 .3cqw; color: rgba(227, 188, 120, .7); }
.node {
  position: absolute; top: 39.5cqw; left: calc(var(--x) * 1cqw); width: .7cqw; height: .7cqw;
  transform: translate(-50%, -50%) rotate(45deg); background: var(--stone-950);
  border: 1px solid rgba(227, 188, 120, .8); z-index: 9; opacity: 0; transition: opacity .6s, background .4s, box-shadow .4s;
  pointer-events: none;
}
.node.on { background: var(--gold); box-shadow: 0 0 .8cqw rgba(227, 188, 120, .9); }
.stage[data-phase="explore"] .gap, .stage[data-phase="finale"] .gap,
.stage[data-phase="explore"] .node, .stage[data-phase="finale"] .node,
.stage[data-phase="spread"] .node { opacity: 1; }
.stage[data-phase="spread"] .node { transition-delay: calc(.3s + var(--i) * .18s); }
.stage[data-phase="spread"] .plate { animation: plateIn .8s var(--ease) both; animation-delay: calc(.5s + var(--i) * .16s); }
@keyframes plateIn { from { opacity: 0; transform: translateX(-50%) translateY(.6cqw); } }
.stage[data-phase="os"] .plate, .stage[data-phase="split"] .plate { opacity: 0; }

/* 追光 */
.spotlight {
  position: absolute; top: 0; left: 0; width: 30cqw; height: 42cqw; z-index: 5; pointer-events: none;
  transform: translateX(calc(var(--sx, 50) * 1cqw - 15cqw));
  background:
    radial-gradient(50% 9% at 50% 94%, rgba(255, 214, 150, .26), transparent 70%),
    linear-gradient(to bottom, rgba(255, 220, 160, 0), rgba(255, 220, 160, .085) 70%, rgba(255, 220, 160, .04));
  clip-path: polygon(44% 0, 56% 0, 94% 100%, 6% 100%);
  filter: blur(.6cqw);
  mix-blend-mode: screen;
  opacity: 0;
  transition: opacity .6s, transform .7s var(--ease);
}
.stage.has-active .spotlight { opacity: 1; }

/* =========================================================
   对话面板（沿用 demo 对话框样式）
   ========================================================= */
.panel {
  position: absolute; left: 50%; bottom: 1.5cqw; width: 70cqw; transform: translateX(-50%);
  min-height: 9.2cqw; padding: 1.05cqw 1.5cqw 1.15cqw;
  border-radius: .9cqw; border: 1px solid var(--stone-800);
  background: rgba(12, 10, 9, .9);
  box-shadow: 0 1.5cqw 3cqw rgba(0, 0, 0, .55);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 25;
  transition: border-color .4s, opacity .5s;
}
.panel.clickable { cursor: pointer; }
.panel.clickable:hover { border-color: rgba(245, 158, 11, .6); }
.panel.speaking { border-color: rgba(217, 119, 6, .55); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 1cqw; padding-bottom: .55cqw; margin-bottom: .6cqw; border-bottom: 1px solid rgba(41, 37, 36, .9); }
.who { display: flex; align-items: center; gap: .7cqw; min-width: 0; }
.chip {
  flex: none; padding: .18cqw .62cqw; border-radius: .3cqw;
  font-weight: 700; font-size: .98cqw; letter-spacing: .14em;
  background: #000; color: var(--amber-300); border: 1px solid var(--amber-600);
}
.chip.os { background: rgba(69, 26, 3, .7); color: var(--amber-200); border-color: rgba(245, 158, 11, .6); font-style: italic; }
.chip.narr { background: var(--stone-900); color: var(--stone-200); border-color: rgba(68, 64, 60, .8); }
.chip.answer { background: var(--seal); color: #fbeee0; border-color: #e0574d; }
.desc { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: .8cqw; color: var(--stone-400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aside { flex: none; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: .78cqw; color: var(--stone-400); display: flex; align-items: center; gap: .3cqw; }
.aside.pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.line { margin: 0; min-height: 4.4cqw; font-size: max(12px, 1.36cqw); line-height: 1.68; letter-spacing: .06em; color: var(--stone-100); }
.line em { font-style: normal; font-weight: 700; color: var(--amber-300); }
.line .caret { display: inline-block; width: .1cqw; height: 1.2em; margin-left: .15cqw; vertical-align: -.2em; background: var(--amber-300); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.actions { flex: none; display: flex; gap: .6cqw; margin: -.3cqw 0; }
.actions[hidden] { display: none; }
.btn {
  display: inline-flex; align-items: center; gap: .4cqw;
  padding: .42cqw 1.1cqw; border-radius: .6cqw; font-weight: 700; font-size: .9cqw; letter-spacing: .12em;
  background: var(--amber-500); color: var(--stone-950); box-shadow: 0 .4cqw 1.2cqw rgba(0, 0, 0, .4);
  transition: transform .2s, background .2s;
}
.btn:hover { background: var(--amber-400); transform: scale(1.04); }
.btn.ghost { background: var(--stone-900); color: var(--stone-200); border: 1px solid var(--stone-700); box-shadow: none; }
.btn.ghost:hover { background: var(--stone-800); }
.btn.glow { animation: glow 2s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 .3cqw rgba(245, 158, 11, .25), 0 0 2cqw rgba(245, 158, 11, .45); } }
.panel .fade { animation: fadeIn .45s var(--ease) both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(.3cqw); } }

.skip {
  position: absolute; right: 2.4cqw; bottom: 12.2cqw; z-index: 30;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: .8cqw; letter-spacing: .14em; color: var(--stone-400);
  padding: .35cqw .8cqw; border: 1px solid var(--stone-700); border-radius: 99px; background: rgba(12, 10, 9, .6);
  transition: opacity .4s, color .3s;
}
.skip:hover { color: var(--stone-100); }
.skip[hidden] { display: none; }

/* 揭晓 */
.stage[data-phase="finale"] .bg-watermark { color: rgba(227, 188, 120, .05); text-shadow: 0 0 6cqw rgba(227, 188, 120, .1); }
.stage[data-phase="finale"] .bg-glow { opacity: 1; }

/* 无动画模式 */
.stage.instant, .stage.instant * { transition: none !important; animation-duration: 0s !important; animation-delay: 0s !important; }
@media (prefers-reduced-motion: reduce) {
  .fog, .flag { animation: none !important; }
  .slot, .fig, .spotlight, .headline .swap { transition-duration: .01s !important; }

/* =========================================================
   三、声音：五声音阶钟声（WebAudio 合成，无需音频文件）+ 可选朗读
   ========================================================= */
const Sound = (() => {
  let ctx = null, master = null, on = true;
  function ensure() {
    if (!on) return null;
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = .5;
        master.connect(ctx.destination);
      }
      if (ctx.state === "suspended") ctx.resume();
    } catch (e) { return null; }
    return ctx;
  }
  function bell(freq, delay = 0, vol = .16) {
    const c = ensure(); if (!c) return;
    const t = c.currentTime + .02 + delay;
    [[1, 1, 2.6], [2.01, .32, 1.4], [2.76, .18, 1.0], [5.4, .06, .5]].forEach(([m, a, d]) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = freq * m;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * a, t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + d + .05);
    });
  }
  return {
    get on() { return on; },
    set on(v) { on = v; if (v) ensure(); },
    unlock: ensure,
    bell,
    boom() { bell(146.83, 0, .22); bell(220, .06, .08); }
  };
})();

const Voice = (() => {
  const synth = window.speechSynthesis;
  let voice = null, on = false;
  function pick() {
    if (!synth) return;
    const vs = synth.getVoices();
    voice = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
    document.getElementById("btnVoice").hidden = !voice;
  }
  if (synth) { pick(); synth.addEventListener?.("voiceschanged", pick); }
  return {
    get on() { return on; },
    set on(v) { on = v; if (!v) this.stop(); },
    say(text) {
      if (!on || !voice) return;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.voice = voice; u.lang = voice.lang; u.rate = .95; u.pitch = .85;
      synth.speak(u);
    },
    stop() { synth && synth.cancel(); }
  };
})();

/* =========================================================
   四、交互主逻辑
   ========================================================= */
const $ = s => document.querySelector(s);
const stage = $("#stage"), row = $("#row"), panel = $("#panel");
const ui = {
  chip: $("#chip"), desc: $("#desc"), aside: $("#aside"), line: $("#line"), lineSr: $("#lineSr"),
  actions: $("#actions"), title: $("#title"), subtitle: $("#subtitle"), progress: $("#progress"), spot: $("#spotlight")
};
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarse = window.matchMedia("(hover: none), (pointer: coarse)").matches;

const state = { phase: "os", active: -1, heard: new Set(), timers: [], typing: null };
const slots = [];

// ---------- 构建场景 ----------
$("#me").innerHTML = ART.me;
const tlLayer = $("#timeline-layer");
MONARCHS.forEach((m, i) => {
  const li = document.createElement("li");
  li.className = "slot";
  li.style.setProperty("--x", m.x);
  li.style.setProperty("--i", i);
  const art = m.img ? `<img src="${m.img}" alt="" draggable="false">` : ART.list[i];
  li.innerHTML = `
    <button class="monarch" type="button" aria-label="${m.name}，${m.desc}">
      <span class="fig">${art}<span class="seal" style="--i:${i}" aria-hidden="true">${[...m.tag].map(c => `<b>${c}</b>`).join("")}</span></span>
      <span class="plate"><span class="name"><i class="ord">${"一二三四五"[i]}</i>${m.name}</span><span class="era">${m.era}</span></span>
    </button>`;
  row.appendChild(li);
  slots.push(li);
  const node = document.createElement("span");
  node.className = "node"; node.style.setProperty("--x", m.x); node.style.setProperty("--i", i);
  tlLayer.appendChild(node);
  if (i < MONARCHS.length - 1) {
    const g = document.createElement("span");
    g.className = "gap"; g.textContent = GAPS[i];
    g.style.setProperty("--x", (m.x + MONARCHS[i + 1].x) / 2);
    tlLayer.appendChild(g);
  }
});
const nodes = [...tlLayer.querySelectorAll(".node")];

// ---------- 小工具 ----------
const later = (fn, ms) => { const t = setTimeout(fn, ms); state.timers.push(t); return t; };
const clearTimers = () => { state.timers.forEach(clearTimeout); state.timers = []; };
const skipBtn = $("#skip");
function setPhase(p) {
  state.phase = p;
  stage.dataset.phase = p;
  skipBtn.hidden = !(p === "os" || p === "split" || p === "spread");
}
function setHeadline(title, sub, delay = 0) {
  [ui.title, ui.subtitle].forEach(el => el.classList.remove("show"));
  later(() => {
    ui.title.innerHTML = title || "";
    ui.subtitle.innerHTML = sub || "";
    if (title) ui.title.classList.add("show");
    if (sub) later(() => ui.subtitle.classList.add("show"), 700);
  }, delay + 380);
}
function renderProgress() {
  const n = state.heard.size;
  ui.progress.innerHTML = MONARCHS.map((_, i) => `<i class="${state.heard.has(i) ? "on" : ""}"></i>`).join("") +
    `<span>已聆听 <b>${n}</b> / ${MONARCHS.length}</span>`;
  slots.forEach((s, i) => s.classList.toggle("is-heard", state.heard.has(i)));
  nodes.forEach((nd, i) => nd.classList.toggle("on", state.heard.has(i)));
}

// ---------- 打字机：逐字“播放”台词 ----------
function stopTyping() { if (state.typing) { clearTimeout(state.typing.t); state.typing = null; } }
function typeLine(lead, text, onDone) {
  stopTyping();
  const full = lead + text;
  ui.lineSr.textContent = full;
  const em = document.createElement("em"), span = document.createElement("span"), caret = document.createElement("i");
  caret.className = "caret";
  ui.line.replaceChildren(em, span, caret);
  let n = 0;
  const job = { t: 0, finish: null };
  const draw = () => {
    em.textContent = full.slice(0, Math.min(n, lead.length));
    span.textContent = n > lead.length ? full.slice(lead.length, n) : "";
  };
  const done = () => { n = full.length; draw(); caret.remove(); state.typing = null; onDone && onDone(); };
  job.finish = () => { clearTimeout(job.t); done(); };
  const step = () => {
    n++; draw();
    if (n >= full.length) return done();
    const ch = full[n - 1];
    const d = "。！？".includes(ch) ? 360 : "，、；：」".includes(ch) ? 170 : ch === "—" ? 40 : 46;
    job.t = setTimeout(step, d);
  };
  state.typing = job;
  if (reduceMotion) return done();
  job.t = setTimeout(step, 120);
}
function finishTyping() { if (state.typing) state.typing.finish(); }

// ---------- 面板内容 ----------
function panelMode({ chip, chipClass = "", desc = "", aside = "", asidePulse = false, html = null, lead = "", text = "", typed = false, onTyped, actions = null, speaking = false, clickable = false }) {
  ui.chip.className = "chip " + chipClass;
  ui.chip.textContent = chip;
  ui.desc.textContent = desc;
  ui.aside.innerHTML = aside;
  ui.aside.classList.toggle("pulse", asidePulse);
  panel.classList.toggle("speaking", speaking);
  panel.classList.toggle("clickable", clickable);
  if (typed) typeLine(lead, text, onTyped);
  else {
    stopTyping();
    ui.line.innerHTML = html != null ? html : (lead ? `<em>${lead}</em>` : "") + text;
    ui.lineSr.textContent = ui.line.textContent;
  }
  ui.actions.hidden = !actions;
  ui.actions.innerHTML = "";
  if (actions) actions.forEach(a => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn " + (a.cls || ""); b.textContent = a.label;
    b.addEventListener("click", e => { e.stopPropagation(); a.run(); });
    ui.actions.appendChild(b);
  });
  ui.line.classList.remove("fade"); void ui.line.offsetWidth; ui.line.classList.add("fade");
}

function showIdle() {
  const left = MONARCHS.length - state.heard.size;
  if (state.phase === "finale") {
    panelMode({
      chip: "答案", chipClass: "answer", desc: "这一课的「我」", text: COPY.finale,
      actions: [{ label: COPY.replay, cls: "ghost", run: replay }, { label: COPY.restart, cls: "ghost", run: restart }]
    });
  } else if (left === 0) {
    panelMode({ chip: COPY.readyChip, chipClass: "narr", desc: "旁白", text: COPY.ready, actions: [{ label: COPY.readyBtn, cls: "glow", run: finale }] });
  } else if (state.heard.size === 0) {
    panelMode({ chip: "旁白", chipClass: "narr", desc: "请选择一位君主", text: coarse ? COPY.hintTouch : COPY.hintMouse, aside: "◆ 悬停 · 点按 · ←→ 键", asidePulse: true });
  } else {
    panelMode({ chip: "旁白", chipClass: "narr", desc: `已聆听 ${state.heard.size} / ${MONARCHS.length}`, text: COPY.left(left), aside: "◆ 继续走近下一位", asidePulse: true });
  }
}

function showSpeech(i) {
  const m = MONARCHS[i];
  panelMode({
    chip: m.name, desc: m.desc, aside: `出处 ${m.source}`, lead: m.lead, text: m.text, typed: true, speaking: true, clickable: true,
    onTyped: () => markHeard(i)
  });
  Voice.say(m.lead + m.text);
}

function markHeard(i) {
  if (state.heard.has(i)) return;
  state.heard.add(i);
  renderProgress();
  if (state.heard.size === MONARCHS.length && state.phase === "explore") {
    // 全部听完：在当前台词下方给出揭晓按钮
    ui.actions.hidden = false;
    if (!ui.actions.querySelector(".glow")) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "btn glow"; b.textContent = COPY.readyBtn;
      b.addEventListener("click", e => { e.stopPropagation(); finale(); });
      ui.actions.appendChild(b);
    }
  }
}

// ---------- 激活某位君主（悬停 / 点按 / 键盘） ----------
function activate(i) {
  if (!["explore", "finale"].includes(state.phase)) return;
  if (i === state.active) return;
  state.active = i;
  stage.classList.toggle("has-active", i >= 0);
  slots.forEach((s, k) => {
    s.classList.toggle("is-active", k === i);
    s.classList.toggle("is-lit", k === i || state.phase === "finale");
  });
  if (i >= 0) {
    ui.spot.style.setProperty("--sx", MONARCHS[i].x);
    showSpeech(i);
    Sound.bell(MONARCHS[i].tone);
  } else {
    Voice.stop();
    showIdle();
  }
}

let intentT = 0, leaveT = 0;
function scheduleIdle(ms = 420) { clearTimeout(leaveT); leaveT = setTimeout(() => activate(-1), ms); }
slots.forEach((s, i) => {
  const btn = s.querySelector(".monarch");
  btn.addEventListener("pointerenter", e => {
    if (e.pointerType === "touch") return;
    clearTimeout(leaveT); clearTimeout(intentT);
    if (i !== state.active) intentT = setTimeout(() => activate(i), state.active < 0 ? 40 : 110);
  });
  btn.addEventListener("pointerleave", e => {
    if (e.pointerType === "touch") return;
    clearTimeout(intentT);
    scheduleIdle();
  });
  btn.addEventListener("click", e => {
    e.stopPropagation();
    clearTimeout(intentT); clearTimeout(leaveT);
    if (i === state.active) finishTyping(); else activate(i);
  });
  btn.addEventListener("focus", () => { if (btn.matches(":focus-visible")) activate(i); });
  btn.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      const n = (i + (e.key === "ArrowRight" ? 1 : -1) + slots.length) % slots.length;
      slots[n].querySelector(".monarch").focus();
      activate(n);
    } else if (e.key === "Escape") { btn.blur(); activate(-1); }
  });
});
panel.addEventListener("pointerenter", () => clearTimeout(leaveT));
panel.addEventListener("pointerleave", e => { if (e.pointerType !== "touch" && state.active >= 0) scheduleIdle(); });
panel.addEventListener("click", () => {
  if (state.phase === "os") return; // 心声阶段由全局点击处理
  if (state.typing) finishTyping();
});
// 触屏：点空白处收起
stage.addEventListener("click", e => {
  if (state.phase === "os") return;
  if (!e.target.closest(".monarch, .panel, .hud, .skip") && state.active >= 0) activate(-1);
});

// ---------- 片头：衔接“我”的内心 OS → 一分为五 ----------
function startOS() {
  clearTimers();
  setPhase("os");
  stage.classList.remove("has-active");
  setHeadline("", "");
  panelMode({ chip: COPY.osChip, chipClass: "os", desc: COPY.osDesc, text: COPY.osLine, typed: true, clickable: true,
    onTyped: () => { ui.aside.innerHTML = "点击继续 ›"; ui.aside.classList.add("pulse"); } });
}
function reveal() {
  if (state.phase !== "os") return;
  Sound.unlock();
  finishTyping();
  setPhase("split");
  Sound.boom();
  panelMode({ chip: "旁白", chipClass: "narr", desc: "", text: "" });
  later(() => { setPhase("spread"); setHeadline(COPY.revealTitle, COPY.revealSub); }, 950);
  MONARCHS.forEach((m, i) => later(() => Sound.bell(m.tone, 0, .07), 1300 + i * 180));
  later(() => { setPhase("explore"); showIdle(); }, 4400);
}
function skipIntro() {
  clearTimers();
  finishTyping();
  Sound.unlock();
  stage.classList.add("instant");
  setPhase("explore");
  ui.title.innerHTML = COPY.revealTitle; ui.subtitle.innerHTML = COPY.revealSub;
  ui.title.classList.add("show"); ui.subtitle.classList.add("show");
  showIdle();
  requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove("instant")));
}

// ---------- 揭晓 ----------
function finale() {
  if (state.phase === "finale") return;
  clearTimeout(leaveT);
  state.active = -1;
  stage.classList.remove("has-active");
  setPhase("finale");
  slots.forEach(s => { s.classList.remove("is-active"); s.classList.add("is-lit"); });
  Voice.stop();
  setHeadline(COPY.finaleTitle, COPY.finaleSub);
  showIdle();
  MONARCHS.forEach((m, i) => Sound.bell(m.tone, .5 + i * .32, .12));
  Sound.bell(146.83, .5 + 5 * .32 + .2, .18);
}
function replay() {
  clearTimers();
  state.heard.clear();
  renderProgress();
  state.active = -1;
  slots.forEach(s => s.classList.remove("is-lit", "is-active"));
  setPhase("explore");
  setHeadline(COPY.revealTitle, COPY.revealSub);
  showIdle();
}
function restart() {
  state.heard.clear();
  renderProgress();
  state.active = -1;
  slots.forEach(s => s.classList.remove("is-lit", "is-active"));
  stage.classList.add("instant");
  startOS();
  requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove("instant")));
}

// 心声阶段：点击任意处 / 回车 / 空格继续
stage.addEventListener("click", e => {
  if (state.phase !== "os" || e.target.closest(".hud, .skip")) return;
  if (state.typing) { finishTyping(); return; }
  reveal();
});
document.addEventListener("keydown", e => {
  if (state.phase === "os" && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    if (state.typing) finishTyping(); else reveal();
  }
});
$("#skip").addEventListener("click", e => { e.stopPropagation(); skipIntro(); });

// 声音开关
const btnSound = $("#btnSound"), btnVoice = $("#btnVoice");
btnSound.addEventListener("click", e => {
  e.stopPropagation();
  Sound.on = !Sound.on;
  btnSound.setAttribute("aria-pressed", Sound.on);
});
btnVoice.addEventListener("click", e => {
  e.stopPropagation();
  Voice.on = !Voice.on;
  btnVoice.setAttribute("aria-pressed", Voice.on);
  if (Voice.on && state.active >= 0) Voice.say(MONARCHS[state.active].lead + MONARCHS[state.active].text);
});

// ---------- 浮尘 ----------
(function dust() {
  const cv = $("#dust"), cx = cv.getContext("2d");
  let w = 0, h = 0, dpr = 1, motes = [];
  function size() {
    const r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = r.width; h = r.height;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    motes = Array.from({ length: 70 }, () => ({
      x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.4 + .3,
      vx: (Math.random() - .5) * .08, vy: -(Math.random() * .12 + .03), a: Math.random() * .5 + .15, p: Math.random() * 6.28
    }));
  }
  function tick(t) {
    cx.clearRect(0, 0, w, h);
    for (const m of motes) {
      m.x += m.vx; m.y += m.vy;
      if (m.y < -4) { m.y = h + 4; m.x = Math.random() * w; }
      if (m.x < -4) m.x = w + 4; else if (m.x > w + 4) m.x = -4;
      const a = m.a * (.6 + .4 * Math.sin(t / 900 + m.p));
      cx.beginPath(); cx.arc(m.x, m.y, m.r, 0, 6.283);
      cx.fillStyle = `rgba(232, 196, 130, ${a})`; cx.fill();
    }
    if (!reduceMotion) requestAnimationFrame(tick);
  }
  size();
  window.addEventListener("resize", size);
  requestAnimationFrame(tick);
})();

renderProgress();
startOS();
</script>
